# Holiday emoji map -- a shared default for NUS courses using
# institutions/nus/fetch-calendar-data.sh. Not course-specific: maps a
# Singapore public holiday's base name to one emoji, for use with
# core/enrich-lib.sh's holiday_emoji (read via cli.sh's EMOJI_FILE, a
# course's own config/holiday-emoji.conf -- copy this file there as a
# starting point, or point EMOJI_FILE at this one directly).
#
# Names must match config/holidays.conf's own Holiday Name field,
# stripped of any "(Observed)"/"(observed)" suffix -- the observed
# version of a holiday shares its base holiday's emoji (holiday_emoji()
# already handles the strip). data.gov.sg's feed is inconsistent year to
# year about apostrophe style ("New Year's Day" vs "New Year's Day",
# both straight and curly appear in fetched data) -- holiday_emoji()
# normalizes curly to straight before matching, so keep this file's own
# key in straight-apostrophe form.
#
# Format: HOLIDAY_NAME|EMOJI

New Year's Day|🎉
Chinese New Year|🧧
Hari Raya Puasa|🌙
Good Friday|✝️
Labour Day|⚒️
Hari Raya Haji|🌙
Vesak Day|🪷
National Day|🇸🇬
NUS Well-Being Day|🧘
Deepavali|🪔
Christmas Day|🎄
Polling Day|🗳️
